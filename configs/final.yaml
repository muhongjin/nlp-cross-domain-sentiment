seed: 42
data:
  train_per_class: 10000
  test_per_class: 5000
  val_rows_prepared: 2000
  val_rows_used:
    within: 1000
    mixed: 4000
tfidf:
  selection: per-domain grid over C in {0.5,1,2} and ngram in {(1,1),(1,2)}
  best:
  - domain: amazon
    model: tfidf_lr
    C: 2.0
    ngram_range: (1, 2)
    val_macro_f1: 0.8795
  - domain: amazon
    model: tfidf_svm
    C: 0.5
    ngram_range: (1, 2)
    val_macro_f1: 0.891
  - domain: imdb
    model: tfidf_lr
    C: 2.0
    ngram_range: (1, 2)
    val_macro_f1: 0.894
  - domain: imdb
    model: tfidf_svm
    C: 2.0
    ngram_range: (1, 2)
    val_macro_f1: 0.9055
  - domain: yelp
    model: tfidf_lr
    C: 2.0
    ngram_range: (1, 2)
    val_macro_f1: 0.9295
  - domain: yelp
    model: tfidf_svm
    C: 2.0
    ngram_range: (1, 2)
    val_macro_f1: 0.9335
distilbert:
  model: distilbert-base-uncased
  max_len: 256
  batch_size: 32
  epochs: 3
  learning_rate: 2.0e-05
  selection: learning rate chosen on IMDb validation; applied to every domain
  val_macro_f1: 0.9089991809926289
